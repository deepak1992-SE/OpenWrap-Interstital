services:
  - type: web
    name: openwrap-lineitem-generator
    env: python
    buildCommand: pip install -r requirements-minimal.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: USE_BACKGROUND_THREAD
        value: true
